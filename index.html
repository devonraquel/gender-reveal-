<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Little Surprise</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #fffaf7, #eee5dc);
  font-family: Georgia, serif;
  color: #665b54;
  text-align: center;
}

.card {
  width: 85%;
  max-width: 400px;
  padding: 55px 25px;
  border-radius: 30px;
  background: white;
  box-shadow: 0 20px 60px rgba(0,0,0,.12);
}

h1 {
  font-size: 34px;
  font-weight: normal;
}

p {
  font-size: 18px;
  line-height: 1.6;
}

button {
  margin-top: 25px;
  padding: 20px 30px;
  border: none;
  border-radius: 50px;
  background: #665b54;
  color: white;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 2px;
  cursor: pointer;
}

.hidden {
  display: none;
}

.baby {
  font-size: 50px;
}

.answer h1 {
  font-size: 48px;
}

.confetti {
  position: fixed;
  top: -20px;
  width: 9px;
  height: 15px;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
  }
}
</style>
</head>

<body>

<div class="card" id="front">
  <h1>A Little Surprise…</h1>

  <p>
    Someone very special<br>
    is on the way. 💕
  </p>

  <p>
    Are you ready to find out?
  </p>

  <button onclick="reveal()">
    TAP TO REVEAL
  </button>
</div>

<div class="card hidden answer" id="answer">
  <div class="baby">💙</div>

  <p>THE SECRET IS OUT!</p>

  <h1>IT'S A BOY!</h1>

  <p>
    Our little boy is on the way 💙
  </p>
</div>

<script>
function reveal() {

  document.getElementById("front").classList.add("hidden");

  document.getElementById("answer").classList.remove("hidden");

  for (let i = 0; i < 80; i++) {

    let confetti = document.createElement("div");

    confetti.className = "confetti";

    confetti.style.left =
      Math.random() * 100 + "vw";

    confetti.style.background =
      ["#8fb7d9","#b9d5ea","#d8e8f4","#6f9fc4"]
      [Math.floor(Math.random() * 4)];

    confetti.style.animationDelay =
      Math.random() + "s";

    document.body.appendChild(confetti);

    setTimeout(() => {
      confetti.remove();
    }, 4000);
  }
}
</script>

</body>
</html>
